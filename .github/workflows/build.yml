name: Build TVBox for Android 4.2.2 x86

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --console=plain --max-workers=1

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVBox-Android4.2-x86-Debug
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
