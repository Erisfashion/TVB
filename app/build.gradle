apply plugin: 'com.android.application'

android {
    compileSdkVersion 32
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.github.tvbox.osc"
        minSdkVersion 17
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0-x86"

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters "x86", "armeabi-v7a"
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/normal/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        pickFirst 'lib/x86/libijkffmpeg.so'
        pickFirst 'lib/x86/libijkplayer.so'
        pickFirst 'lib/x86/libijksdl.so'
        pickFirst 'lib/x86/libquickjs-android.so'
        pickFirst 'lib/armeabi-v7a/libijkffmpeg.so'
        pickFirst 'lib/armeabi-v7a/libijkplayer.so'
        pickFirst 'lib/armeabi-v7a/libijksdl.so'
        pickFirst 'lib/armeabi-v7a/libquickjs-android.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:-unchecked" << "-Xlint:-deprecation"
}

configurations.all {
    resolutionStrategy {
        force 'com.squareup.okhttp3:okhttp:3.12.13'
        force 'com.squareup.okio:okio:1.17.5'
        force 'androidx.multidex:multidex:2.0.1'
        force 'androidx.core:core:1.5.0'
        force 'androidx.appcompat:appcompat:1.3.1'
        force 'com.google.code.gson:gson:2.8.9'
        force 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation(name: 'xwalk_shared_library-23.53.589.4', ext: 'aar')
    implementation project(':player')

    // 关键补齐：解决 Android x86 设备缺少 ijk 播放器 .so 文件导致的 UnsatisfiedLinkError 闪退
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'

    // 列表控件与适配器
    implementation 'com.owen:tv-recyclerview:2.0.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'

    // 文件选择器、屏幕适配与动态权限
    implementation 'com.obsez.android.lib.filechooser:filechooser:1.2.0'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation 'com.github.getActivity:XXPermissions:11.6'

    // IO 流处理与 XStream 序列化
    implementation 'commons-io:commons-io:2.11.0'
    implementation('com.thoughtworks.xstream:xstream:1.4.18') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }

    // ExoPlayer 核心与扩展
    implementation 'com.google.android.exoplayer:exoplayer:2.14.2'
    implementation 'com.google.android.exoplayer:extension-okhttp:2.14.2'
    implementation 'com.google.android.exoplayer:extension-rtmp:2.14.2'

    // 注解与字符集探测
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'

    // DKPlayer UI 控制层组件
    implementation('xyz.doikki.android.dkplayer:dkplayer-ui:3.3.5') {
        exclude group: 'xyz.doikki.android.dkplayer', module: 'dkplayer-java'
    }

    // AndroidX 核心组件
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'

    // Room 本地数据库
    implementation 'androidx.room:room-runtime:2.3.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'

    // 网络与图像组件
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.13'
    implementation 'com.squareup.okio:okio:1.17.5'
    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'org.brotli:dec:0.1.2'

    // 本地 HTTP 服务器
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'

    // 工具组件
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'com.google.zxing:core:3.4.1'
}
